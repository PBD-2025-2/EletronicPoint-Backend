spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                 - "http://localhost:4200"
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                allowed-headers: "*"
                allow-credentials: true
          routes:
            - id: eletronicPoint
              uri: lb://EletronicPoint
              predicates:
                - Path=/eletronicPoint/**
              filters:
                - StripPrefix=1
                - AuthenticationFilter

            - id: authentication
              uri: lb://Authentication
              predicates:
                - Path=/auth/**
              filters:
                  - StripPrefix=1
server:
  port: 8282

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/